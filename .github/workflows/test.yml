name: deeptune test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      env:
        OMP_NUM_THREADS: '2'
        MKL_NUM_THREADS: '2'
      run: |
        python -m pip check
        python -m pytest tests --disable-warnings -q

    - name: Build package
      run: python -m pip wheel . --no-deps --wheel-dir dist
