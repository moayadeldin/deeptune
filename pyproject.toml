[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DeepTune"
version = "1.1.0"
description = "Multimodal deep learning training, evaluation, and embeddings with a desktop interface"
authors = [{name = "Moayadeldin Hussain", email = "moayadeldin@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=7.4,<10"]

[project.scripts]
deeptune = "deeptune:main"
deeptune-desktop = "desktop.app:main"

[tool.setuptools]
py-modules = ["deeptune", "infer", "cli", "helpers", "utils", "options"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["desktop*", "datasets*", "handlers*", "src*", "trainers*", "evaluators*", "embed*", "autoencoders*", "inference*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: requires a graphics-capable desktop"]
